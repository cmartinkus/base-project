[build-system]
requires = [
    "setuptools>=68",
    "wheel"
]
build-backend = "setuptools.build_meta"


[project]
name = "python_service"
version = "0.1.0"
description = "Background processing service"
requires-python = ">=3.12"


dependencies = [

    # Scheduling
    "apscheduler>=3.10",

    # Database
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",

    # Messaging
    "pika>=1.4.2",

    # Configuration
    "pydantic>=2.0",
    "pydantic-settings>=2.0",

    # Shared package
    "basic-common",

]


[tool.setuptools.packages.find]
where = [
    "src"
]


[tool.uv.sources]
basic-common = {
    path = "../common",
    editable = true
}