version: "3.9"

services:
  api:
    image: api:1.0
    build:
      context: .
      dockerfile: api/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    #depends_on:
      #- db
    restart: unless-stopped
  db:
    image: postgres:17
    ports:
      - "5432:5432"
    env_file:
      .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/migration/db_init.sql:/docker-entrypoint-initdb.d/db_init.sql
  ui:
    image: ui:1.0
    build:
      context: ./ui
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - .env
    restart: unless-stopped
  python-service:
    image: python-service:1.0
    build:
      context: .
      dockerfile: python_service/Dockerfile
    env_file:
      - .env
    restart: unless-stopped
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    env_file:
      - .env
  worker-service:
    image: worker-service:1.0
    build:
      context: .
      dockerfile: python_service/Dockerfile
    env_file:
      - .env

volumes:
  postgres_data: