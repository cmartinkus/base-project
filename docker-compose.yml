version: "3.9"

services:
  api:
    build: ./api
    ports:
      - "8000:8000"
    env_file:
      - .env
    #depends_on:
      #- db
    restart: unless-stopped
  db:
    image: postgres:17
    env_file:
      .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
  ui:
    build: ./ui
    env_file:
      - .env
    restart: unless-stopped
  python-service:
    build: ./python-service
    env_file:
      - .env
    restart: unless-stopped

volumes:
  postgres_data: