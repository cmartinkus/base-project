version: "3.9"

services:
  api:
    build: ./api
    ports:
      - "8000:8000"
    env_file:
      - .env
    #depends_on:
      #- db
    restart: unless-stopped
  db:
    image: postgres:17
    ports:
      - "5432:5432"
    env_file:
      .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
  ui:
    build: ./ui
    ports:
      - "3000:3000"
    env_file:
      - .env
    restart: unless-stopped
  python-service:
    build: ./python-service
    env_file:
      - .env
    restart: unless-stopped
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
    env_file:
      - .env

volumes:
  postgres_data: